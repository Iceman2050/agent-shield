name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Self-scan the bundled fixtures
        run: |
          # The fixtures intentionally contain adversarial artifacts,
          # so a non-zero exit (critical findings detected) is success here.
          agent-shield scan tests/fixtures --format json --output /tmp/acbom.json || test $? -eq 1
          python -c "import json; d=json.load(open('/tmp/acbom.json')); assert d['summary']['artifacts'] == 6"
