[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-shield"
version = "0.1.0"
description = "Security scanner for AI agent artifacts — skills, MCP configs, and plugins. Inventories the agent supply chain (Agent SBOM), detects risky code and suspicious instructions, and locks approved versions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Ingenious AI" }]
keywords = ["ai-agents", "security", "mcp", "sbom", "supply-chain", "agent-skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agent-shield = "agent_shield.cli:main"

[project.urls]
Homepage = "https://github.com/Iceman2050/agent-shield"
Repository = "https://github.com/Iceman2050/agent-shield"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
